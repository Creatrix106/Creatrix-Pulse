[project]
name = "creatrix-pulse-backend"
version = "1.0.0"
description = "FastAPI + PostgreSQL + pandas backend for the Creatrix Pulse analytics dashboard."
readme = "README.md"
requires-python = ">=3.15"
dependencies = [
    # --- web framework -------------------------------------------------------
    "fastapi>=0.162.0,<0.163",
    "uvicorn>=0.54.0,<0.55",
    "uvloop>=0.23.0",          # fast event loop (explicit instead of uvicorn[standard], which pulls PyYAML)
    "httptools>=0.9.0",        # fast HTTP parser for uvicorn
    "python-multipart>=0.0.33",  # multipart/form-data uploads
    "pydantic>=2.14.3,<3",
    "pydantic-settings>=2.16.2,<3",
    "email-validator>=2.3.0",
    # --- database ------------------------------------------------------------
    "sqlalchemy[asyncio]>=2.1.8,<2.2",
    "psycopg[binary]>=3.3.8,<4",
    "alembic>=1.20.1,<2",
    # --- data analysis ---------------------------------------------------------
    "pandas>=3.1.1,<4",
    "numpy>=2.5.4,<3",
    "pyarrow>=26.0.1",         # Arrow-backed string dtype (pandas 3 default) + fast parsing
    "python-calamine>=0.9.1",  # Rust Excel reader: .xlsx and legacy .xls, no xlrd/openpyxl needed
    # --- auth & i18n -------------------------------------------------------------
    "pwdlib[argon2]>=0.3.1",   # Argon2id password hashing
    "babel>=2.18.0",           # CLDR currency/number/date formatting for insight text
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1",
    "pytest-cov>=7.1.0",
    "httpx>=0.28.1",
    "ruff>=0.17.4",
    "mypy>=2.4.1",
    "pandas-stubs>=3.1.0",
    "watchfiles>=1.3.0",       # uvicorn --reload
    "openpyxl>=3.1.5",         # tests: build .xlsx fixtures
    "xlwt>=1.3.0",             # tests: build legacy .xls fixtures
]

[tool.uv]
package = false

[tool.ruff]
line-length = 120
target-version = "py315"
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC", "S", "PT", "RUF"]
ignore = [
    "E501",   # layout is owned by `ruff format`; long user-facing message strings are fine
    "S101",   # assert is fine in tests
    "B008",   # FastAPI Depends()/Query() in argument defaults is the idiom
    "RUF001", "RUF002", "RUF003",  # typographic quotes/dashes are intentional in user-facing text
    "RUF012", # mutable class attrs on pydantic models
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S311", "PT018", "RUF007", "ANN"]
"migrations/**" = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
filterwarnings = [
    "error",  # any deprecated pandas/SQLAlchemy/pydantic API use must fail the build, not pass silently
]

[tool.mypy]
python_version = "3.15"
plugins = ["pydantic.mypy"]
strict = true
files = ["app"]
